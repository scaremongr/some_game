# quad-snd объявляет свои JS-функции без `#[link(wasm_import_module = "env")]`,
# и линкер новых версий Rust считает их неразрешёнными символами вместо
# импортов. Флаг возвращает прежнее поведение: всё неразрешённое становится
# импортом из модуля "env" — ровно туда, куда audio.js их и кладёт.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=--import-undefined"]
